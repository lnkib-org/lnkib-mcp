name: Publish to npm

# `vX.Y.Z` 태그를 푸시했을 때만 실행된다. 태그가 package.json 버전과 다르면 실패한다.
# 장기 토큰(NPM_TOKEN)을 쓰지 않는다: npm의 trusted publishing(OIDC)으로 인증하고 출처 증명(provenance)이 자동으로 붙는다.
# 사전 설정: npm 패키지 설정 → Trusted Publisher → GitHub Actions: 저장소 lnkib-org/lnkib-mcp, 워크플로 publish.yml.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest
      - run: npm ci

      - name: Check tag matches package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION"; exit 1
          fi

      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - name: Publish (trusted publishing, no token)
        run: npm publish --access public
